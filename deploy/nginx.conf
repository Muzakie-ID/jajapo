# Nginx untuk Jajapo. Salin ke /etc/nginx/sites-available/jajapo, ganti jajapo.example.id dan
# path PHP-FPM sesuai server, lalu aktifkan HTTPS dengan certbot (PWA, push, dan login Google butuh HTTPS).
server {
    listen 80;
    listen [::]:80;
    server_name jajapo.example.id;
    root /var/www/jajapo/current/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M; # poster, gambar story, dan foto komplain

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Aset build bernama hash: boleh disimpan lama di browser.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service worker harus selalu versi terbaru.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
